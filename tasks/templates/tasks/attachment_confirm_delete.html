{% extends 'tasks/base.html' %}
{% block title %}Delete Attachment - Smart Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark border-secondary">
            <div class="card-body text-center p-5">
                <i class="bi bi-exclamation-triangle display-1 text-warning mb-3"></i>
                <h4 class="text-light">Delete Attachment?</h4>
                <p class="text-muted">
                    Are you sure you want to delete <strong class="text-info">{{ attachment.filename }}</strong>?
                    <br>This action cannot be undone.
                </p>
                <form method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">
                        <i class="bi bi-trash me-1"></i>Delete
                    </button>
                    <a href="{% url 'tasks:task_detail' task.pk %}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
