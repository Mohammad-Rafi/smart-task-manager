{% extends 'tasks/base.html' %}
{% block title %}Login - Smart Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card bg-dark border-secondary">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right text-info me-2"></i>Login</h3>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-info w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                </form>
                <hr class="border-secondary my-4">
                <p class="text-center text-muted mb-0">
                    Don't have an account? <a href="{% url 'tasks:signup' %}" class="text-info">Sign Up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
