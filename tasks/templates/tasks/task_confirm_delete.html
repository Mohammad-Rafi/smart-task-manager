{% extends 'tasks/base.html' %}
{% block title %}Archive Task - Smart Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark border-danger">
            <div class="card-header bg-transparent border-danger">
                <h4 class="mb-0 text-danger"><i class="bi bi-archive me-2"></i>Archive Task</h4>
            </div>
            <div class="card-body text-center">
                <i class="bi bi-exclamation-triangle display-1 text-warning mb-3"></i>
                <h5>Are you sure?</h5>
                <p class="text-muted">
                    You are about to archive <strong>"{{ task.title }}"</strong>.<br>
                    This task will be moved to the archive and can be restored later.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-archive me-2"></i>Archive Task
                        </button>
                        <a href="{% url 'tasks:task_detail' task.pk %}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg me-2"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
