{% extends 'tasks/base.html' %}
{% block title %}Delete Category - Smart Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-dark border-danger">
            <div class="card-header bg-transparent border-danger">
                <h4 class="mb-0 text-danger"><i class="bi bi-trash me-2"></i>Delete Category</h4>
            </div>
            <div class="card-body text-center">
                <i class="bi bi-exclamation-triangle display-1 text-warning mb-3"></i>
                <h5>Delete "{{ category.name }}"?</h5>
                <p class="text-muted">
                    Tasks in this category will become <strong>uncategorized</strong>.<br>
                    This action cannot be undone.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-2"></i>Delete
                        </button>
                        <a href="{% url 'tasks:category_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
